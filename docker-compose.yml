services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: p2p_analytics
      MYSQL_USER: p2p_user
      MYSQL_PASSWORD: p2p_pass
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./public:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: p2p_analytics
      DB_USER: p2p_user
      DB_PASS: p2p_pass
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "8084:80"
    environment:
      PMA_HOST: db
      PMA_USER: p2p_user
      PMA_PASSWORD: p2p_pass
    depends_on:
      - db

volumes:
  db_data: